<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Marty Universe Mission Engine</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    font-family: "Fredoka", sans-serif;
    min-height: 100vh;
    color: white;
    transition: background 0.8s ease;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 20px;
}

/* HEADER */
.header {
    text-align: center;
    margin-top: 10px;
}

.title {
    font-size: 2rem;
    font-weight: 600;
}

.story-box {
    background: rgba(255,255,255,0.15);
    padding: 18px;
    border-radius: 16px;
    margin-top: 15px;
    backdrop-filter: blur(10px);
}

/* PROGRESS */
.progress-bar {
    height: 16px;
    background: rgba(255,255,255,0.2);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 15px;
}

.progress {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#facc15,#f97316);
    transition: 0.3s;
}

/* QUESTION CARD */
.card {
    background: white;
    color: #111827;
    margin-top: 20px;
    padding: 28px;
    border-radius: 22px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

.question {
    font-size: 2.2rem;
    margin: 20px 0;
}

input {
    font-size: 1.5rem;
    padding: 10px;
    width: 140px;
    text-align: center;
    border-radius: 12px;
    border: 2px solid #e5e7eb;
}

button {
    margin-top: 15px;
    padding: 12px 18px;
    font-size: 1.1rem;
    border-radius: 12px;
    border: none;
    cursor: pointer;
}

.check { background: #2563eb; color: white; }
.next { background: #16a34a; color: white; display:none; }

.feedback {
    margin-top: 15px;
    font-size: 1.1rem;
}

/* HUD */
.hud {
    display: flex;
    justify-content: space-between;
    margin-top: 15px;
    opacity: 0.9;
}

/* WORLD THEMES */
.rocketbay { background: linear-gradient(180deg,#0ea5e9,#1e3a8a); }
.numbera   { background: linear-gradient(180deg,#22c55e,#065f46); }
.shadow     { background: linear-gradient(180deg,#4b5563,#111827); }
.robot      { background: linear-gradient(180deg,#f97316,#7c2d12); }
.asteroid   { background: linear-gradient(180deg,#a855f7,#1e1b4b); }
.galaxy     { background: linear-gradient(180deg,#06b6d4,#0f172a); }

</style>
</head>

<body id="body">

<div class="container">

    <div class="header">
        <div class="title" id="worldTitle">🚀 Loading World...</div>

        <div class="story-box" id="storyText">
            Preparing mission...
        </div>

        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

        <div id="counter">Question 1 / 50</div>
    </div>

    <div class="card">

        <div class="question" id="question">---</div>

        <input type="number" id="answer" placeholder=""/>

        <br/>

        <button class="check" onclick="checkAnswer()">Check</button>
        <button class="next" onclick="nextQuestion()">Next</button>

        <div class="feedback" id="feedback"></div>

    </div>

    <div class="hud">
        <div>⭐ XP: <span id="xp">0</span></div>
        <div>🧪 Marty Engine</div>
    </div>

</div>

<script>

/* -----------------------------
   1. GET WORLD FROM URL (FIX)
------------------------------*/

function getWorldFromURL() {
    const params = new URLSearchParams(window.location.search);
    return params.get("world") || "rocket";
}

/* -----------------------------
   2. WORLDS CONFIG
------------------------------*/

const worlds = {
    rocket: {
        class: "rocketbay",
        title: "🚀 Rocket Bay",
        story: "Rod’s rocket is broken. Restore fuel power!",
        difficulty: 1
    },
    numbera: {
        class: "numbera",
        title: "🌍 Planet Numbera",
        story: "The Number Guardians need balance restored.",
        difficulty: 1.2
    },
    shadow: {
        class: "shadow",
        title: "🌑 Shadow Patterns",
        story: "A mysterious force scrambles number patterns.",
        difficulty: 1.3
    },
    robot: {
        class: "robot",
        title: "🛰️ Robot City",
        story: "Machines are failing. Fix them with multiplication.",
        difficulty: 1.4
    },
    asteroid: {
        class: "asteroid",
        title: "🌠 Asteroid Belt",
        story: "Fast asteroids require quick math thinking.",
        difficulty: 1.5
    },
    galaxy: {
        class: "galaxy",
        title: "🪐 Inventor Galaxy",
        story: "Final test: become Master Inventor.",
        difficulty: 1.7
    }
};

/* -----------------------------
   3. INIT WORLD (FIX APPLIED)
------------------------------*/

const worldKey = getWorldFromURL();
const world = worlds[worldKey] || worlds["rocket"];

document.body.classList.add(world.class);

document.getElementById("worldTitle").innerText = world.title;
document.getElementById("storyText").innerText = world.story;

/* -----------------------------
   4. GENERATOR (WORLD-AWARE)
------------------------------*/

function rand(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

function scale(n){
    return Math.round(n * world.difficulty);
}

function make(type){

    if(type==="warmup"){
        let a=scale(rand(1,10)), b=scale(rand(1,10));
        return {q:`${a} + ${b}`, a:a+b, xp:2};
    }

    if(type==="core"){
        let a=scale(rand(10,20));
        let b=scale(rand(1,10));
        let c=scale(rand(1,10));
        return {q:`${a} + ${b} - ${c}`, a:a+b-c, xp:3};
    }

    if(type==="mult"){
        let a=rand(2,10);
        let b=rand(2,10);
        return {q:`${a} × ${b}`, a:a*b, xp:4};
    }

    if(type==="ns"){
        let a=scale(rand(10,25));
        let b=scale(rand(1,10));
        return {q:`__ + ${b} = ${a+b}`, a:a, xp:4};
    }

    if(type==="pat"){
        let s=rand(2,8), st=rand(2,5);
        return {q:`${s} ${s+st} ${s+2*st} ${s+3*st} __`, a:s+4*st, xp:5};
    }

    let a=rand(2,10), b=rand(2,10);
    return {
        q:`Rod has ${a} packs of ${b}. Total?`,
        a:a*b,
        xp:6
    };
}

/* -----------------------------
   5. BUILD MISSION (50 Qs)
------------------------------*/

const types=[
...Array(10).fill("warmup"),
...Array(10).fill("core"),
...Array(10).fill("mult"),
...Array(5).fill("ns"),
...Array(5).fill("pat"),
...Array(10).fill("think")
];

const mission = types.map(t => make(t));

let i = 0;
let xp = 0;

document.getElementById("question").innerText = mission[0].q;

/* -----------------------------
   6. CHECK ANSWER
------------------------------*/

function checkAnswer(){

let val = Number(document.getElementById("answer").value);
let q = mission[i];

if(val === q.a){
    xp += q.xp;

    document.getElementById("feedback").innerHTML =
        "✨ Correct! +" + q.xp + " XP";

    document.getElementById("xp").innerText = xp;

    document.querySelector(".next").style.display = "inline-block";
}
else{
    document.getElementById("feedback").innerHTML =
        "🤔 Not quite. Try again like a scientist.";
}

}

/* -----------------------------
   7. NEXT QUESTION
------------------------------*/

function nextQuestion(){

i++;
document.getElementById("answer").value = "";
document.getElementById("feedback").innerHTML = "";

if(i >= mission.length){
    finish();
    return;
}

document.getElementById("question").innerText = mission[i].q;

document.getElementById("counter").innerText =
`Question ${i+1} / 50`;

document.getElementById("progress").style.width =
(i / mission.length * 100) + "%";

document.querySelector(".next").style.display = "none";

}

/* -----------------------------
   8. FINISH
------------------------------*/

function finish(){

document.querySelector(".card").innerHTML = `
<h1>🎉 Mission Complete</h1>
<p>${world.story}</p>
<h2>Total XP: ${xp}</h2>
<button onclick="location.href='index.html'">Return to Universe</button>
`;

}

</script>

</body>
</html>
